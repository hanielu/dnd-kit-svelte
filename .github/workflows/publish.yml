name: Publish Package

# Publishes the version on main to npm and creates its GitHub release. The release skill (.agents/skills/release)
# runs it with `gh workflow run publish.yml --ref main` after it pushes the version commit; it can also be run by hand
# from the Actions tab. npm trusts this workflow through trusted publishing (OIDC), so no npm token is stored and npm
# attaches provenance. The trusted publisher is configured on npmjs.com under @dnd-kit-svelte/svelte → Settings, for
# hanielu/dnd-kit-svelte and this workflow's filename (publish.yml). Its allowed actions include `npm publish`, so a
# version goes live when this workflow publishes it, without waiting in npm's staging queue for approval.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the package first
      - name: Check
        run: bun run check

      - name: Check formatting
        run: bun run lint

      - name: Read package version
        id: package
        run: echo "version=$(jq -r .version packages/svelte/package.json)" >> "$GITHUB_OUTPUT"

      # Skips a version that is already on npm, so running the workflow again only finishes the GitHub release.
      - name: Publish to npm
        run: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG="@dnd-kit-svelte/svelte@$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            # Notes: this version's changelog section, then GitHub's generated notes (which only list merged PRs)
            awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
              packages/svelte/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --latest
          fi
