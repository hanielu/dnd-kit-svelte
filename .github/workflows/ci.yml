name: CI

# Checks every push to main and every pull request. Releases don't go through a version pull request: the release
# skill (.agents/skills/release) versions locally and runs publish.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the package first
      - name: Check
        run: bun run check

      - name: Check formatting
        run: bun run lint
